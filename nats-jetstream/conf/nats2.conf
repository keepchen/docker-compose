server_name: common-nats2

port: 4222
http: 8222

jetstream {
  store_dir: "/data/jetstream"
  max_mem_store: 1Gb
  max_file_store: 10Gb
}

cluster {
  name: "nats-cluster"
  listen: "0.0.0.0:6222"
  routes: [
    nats://nats1:6222,
    nats://nats3:6222
  ]
}

# 简单用户权限配置
authorization {
  users = [
    { 
      user: user123, 
      password: pass123, 
      permissions: {
        publish = ">"
        subscribe = ">"
        allow_responses = true
      }
    }
  ]
}
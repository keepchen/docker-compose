version: "3.8"

services:
  nats1:
    image: nats:2.10-alpine
    container_name: nats1
    hostname: nats1
    restart: always
    ports:
      - "4222:4222"   # 客户端连接
      - "8222:8222"   # 监控
      - "6222:6222"   # 集群通信
    command: ["-c", "/etc/nats/nats.conf"]
    volumes:
      - ./conf/nats1.conf:/etc/nats/nats.conf
      - ./data/nats1-data:/data/jetstream

  nats2:
    image: nats:2.10-alpine
    container_name: nats2
    hostname: nats2
    restart: always
    ports:
      - "4223:4222"
      - "8223:8222"
      - "6223:6222"
    command: ["-c", "/etc/nats/nats.conf"]
    volumes:
      - ./conf/nats2.conf:/etc/nats/nats.conf
      - ./data/nats2-data:/data/jetstream

  nats3:
    image: nats:2.10-alpine
    container_name: nats3
    hostname: nats3
    restart: always
    ports:
      - "4224:4222"
      - "8224:8222"
      - "6224:6222"
    command: ["-c", "/etc/nats/nats.conf"]
    volumes:
      - ./conf/nats3.conf:/etc/nats/nats.conf
      - ./data/nats3-data:/data/jetstream

  nats-box:
    image: natsio/nats-box:latest
    container_name: nats-box
    restart: unless-stopped
    command: /bin/sh
    stdin_open: true
    tty: true
    depends_on:
      - nats1
      - nats2
      - nats3
    environment:
      - NATS_URL=nats://user123:pass123@nats1:4222

volumes:
  nats1-data:
  nats2-data:
  nats3-data: